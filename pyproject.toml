[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photon-mcp"
version = "0.1.0"
description = "MCP server for the Photon Commerce document extraction API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
photon-mcp = "photon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["photon_mcp"]
