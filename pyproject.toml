[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "photon-mcp"
version = "0.1.0"
description = "MCP server for the Photon Commerce document extraction API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Photon Commerce", email = "api@photoncommerce.com" }]
keywords = ["mcp", "model-context-protocol", "invoice", "ocr", "document-extraction", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Text Processing :: General",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.0.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://www.photoncommerce.com"
Documentation = "https://apidocs.photoncommerce.com/"
Repository = "https://github.com/Photon-Commerce/Photon-MCP"
Issues = "https://github.com/Photon-Commerce/Photon-MCP/issues"
Changelog = "https://github.com/Photon-Commerce/Photon-MCP/blob/main/CHANGELOG.md"

[project.scripts]
photon-mcp = "photon_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["photon_mcp"]

[tool.hatch.build.targets.sdist]
include = ["photon_mcp", "test_photon_mcp.py", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["test_photon_mcp.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
